[package]
name        = "openpika-core"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
rust-version.workspace = true
description = "OpenPika — Rust core engine for the pydantic-ai enterprise agent framework"
default-run = "openpika"

[[bin]]
name = "openpika"
path = "src/main.rs"

[lib]
name = "openpika_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio.workspace        = true
axum.workspace         = true
tower.workspace        = true
tower-http.workspace   = true
serde.workspace        = true
serde_json.workspace   = true
sqlx.workspace         = true
pyo3.workspace         = true
jsonwebtoken.workspace = true
oauth2.workspace       = true
tiktoken-rs.workspace  = true
keyring.workspace      = true
aes-gcm.workspace      = true
rand.workspace         = true
base64.workspace       = true
walkdir.workspace      = true
ignore.workspace       = true
reqwest.workspace      = true
clap.workspace         = true
tracing.workspace      = true
tracing-subscriber.workspace = true
anyhow.workspace       = true
thiserror.workspace    = true
config.workspace       = true
dirs.workspace         = true
uuid.workspace         = true
chrono.workspace       = true
nalgebra.workspace     = true

[features]
default         = ["sqlite"]
sqlite          = []
postgres        = []
enterprise-sso  = []
bundled-python  = []

# ─── cargo-bundle metadata (macOS .app / .dmg installer) ─────────────────────
[package.metadata.bundle]
name            = "OpenPika"
identifier      = "com.openpika.app"
version         = "0.1.0"
copyright       = "OpenPika Contributors"
category        = "Developer Tool"
short_description = "Enterprise AI agent engine"
long_description = """
OpenPika is a high-performance enterprise AI agent framework built on a Rust
core with a pydantic-ai Python brain. It provides a unified webhook gateway,
enterprise SSO, and local-first SQLite state with optional PostgreSQL support.
"""
icon = ["assets/icon.icns", "assets/icon.png"]

# ─── cargo-wix metadata (Windows .msi installer) ─────────────────────────────
[package.metadata.wix]
upgrade-guid    = "A1B2C3D4-E5F6-7890-ABCD-EF1234567890"
path-guid       = "B2C3D4E5-F6A7-8901-BCDE-F12345678901"
license         = false
eula            = false
