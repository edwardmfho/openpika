[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "openpika"
version     = "0.1.0"
description = "OpenPika — enterprise AI agent engine (pydantic-ai brain)"
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.12"
keywords    = ["ai", "agent", "anthropic", "pydantic-ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic-ai[anthropic]>=0.4",
    "pydantic>=2.7",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
    "anthropic>=0.40",
    "rich>=13",
    "typer>=0.12",
    "ddgs>=9",
    "ag-ui-protocol>=0.1",
    "croniter>=3",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.44",
]
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
ui = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
agui = [
    "ag-ui-protocol>=0.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
google = [
    "google-generativeai>=0.8",
]
openai = [
    "openai>=1.30",
]
all = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "playwright>=1.44",
    "google-generativeai>=0.8",
    "openai>=1.30",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
openpika = "openpika.cli.main:app"

[project.urls]
Homepage   = "https://github.com/openpika/openpika"
Repository = "https://github.com/openpika/openpika"

[tool.hatch.build.targets.wheel]
packages = ["src/openpika"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/openpika/agent.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
