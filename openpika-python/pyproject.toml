[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "openpika"
version     = "0.1.0"
description = "OpenPika — pydantic-ai brain for the enterprise agent engine"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai[anthropic]>=0.4",
    "pydantic>=2.7",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
    "anthropic>=0.40",
    "rich>=13",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openpika"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
