version: "3.9"

services:
  openpika:
    build: .
    image: openpika:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/state.db}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENPIKA_LOG_LEVEL=${OPENPIKA_LOG_LEVEL:-info}
    volumes:
      - openpika-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional: Postgres for enterprise deployments
  postgres:
    image: postgres:16-alpine
    profiles: ["enterprise"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: openpika
      POSTGRES_USER: openpika
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpika"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  openpika-data:
  postgres-data:
