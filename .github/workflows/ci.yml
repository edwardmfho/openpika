name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─── Rust: build + test (matrix) ──────────────────────────────────────────
  rust:
    name: Rust (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native Linux x86_64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cross: false

          # Linux ARM64 (cross-compile via cross-rs)
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            cross: true

          # macOS Intel
          - os: macos-13
            target: x86_64-apple-darwin
            cross: false

          # macOS Apple Silicon
          - os: macos-14
            target: aarch64-apple-darwin
            cross: false

          # Windows x86_64 MSVC
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (for cross-compile targets)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install system deps (Linux)
        if: runner.os == 'Linux' && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config python3-dev

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin openpika
          else
            cargo build --release --target ${{ matrix.target }} --bin openpika
          fi
        shell: bash

      - name: Unit tests (native only)
        if: "!matrix.cross"
        run: cargo test --release --target ${{ matrix.target }}
        shell: bash

      - name: Upload binary artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: openpika-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/openpika
            target/${{ matrix.target }}/release/openpika.exe

  # ─── Python: lint + type check + tests ─────────────────────────────────────
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install deps
        working-directory: openpika-python
        run: uv pip install -e ".[dev]" --system
      - name: Lint
        working-directory: openpika-python
        run: ruff check src/
      - name: Type check
        working-directory: openpika-python
        run: mypy src/openpika/ --ignore-missing-imports
      - name: Tests
        working-directory: openpika-python
        run: pytest tests/ -q --tb=short

  # ─── Docker: build + push on release ───────────────────────────────────────
  docker:
    name: Docker (${{ github.event_name == 'release' && 'build+push' || 'build only' }})
    runs-on: ubuntu-24.04
    needs: [rust, python]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on release)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Installers (release only) ──────────────────────────────────────────────
  installers:
    name: Installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [rust]
    if: github.event_name == 'release'
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-bundle (macOS)
        if: runner.os == 'macOS'
        run: cargo install cargo-bundle

      - name: Build macOS .app bundle
        if: runner.os == 'macOS'
        run: cargo bundle --release --target ${{ matrix.target }}

      - name: Create macOS .dmg
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname "OpenPika" \
            -srcfolder "target/${{ matrix.target }}/release/bundle/osx/OpenPika.app" \
            -ov -format UDZO \
            OpenPika-${{ github.ref_name }}-macos-arm64.dmg

      - name: Build Windows binary
        if: runner.os == 'Windows'
        run: cargo build --release --target ${{ matrix.target }} --bin openpika

      - name: Build Windows .msi (WiX)
        if: runner.os == 'Windows'
        run: |
          cargo install cargo-wix
          cargo wix --nocapture --target ${{ matrix.target }}
        shell: bash

      - name: Upload macOS .dmg
        if: runner.os == 'macOS'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: OpenPika-${{ github.ref_name }}-macos-arm64.dmg
          asset_name: OpenPika-${{ github.ref_name }}-macos-arm64.dmg
          asset_content_type: application/octet-stream

      - name: Upload Windows .msi
        if: runner.os == 'Windows'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: target/wix/openpika-${{ github.ref_name }}-x86_64.msi
          asset_name: OpenPika-${{ github.ref_name }}-windows-x64.msi
          asset_content_type: application/octet-stream
